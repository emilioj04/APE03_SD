version: '3.8'

services:
  backend-impresion:
    build: 
      context: ./backend-impresion
    ports:
      - "8081:8080"
    container_name: impresion-backend-service

  frontend-impresion:
    build: 
      context: ./frontend-impresion
    ports:
      - "3001:80"
    container_name: impresion-frontend-service
    depends_on:
      - backend-impresion